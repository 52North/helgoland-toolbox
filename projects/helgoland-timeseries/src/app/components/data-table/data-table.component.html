<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  <ng-container matColumnDef="timestamp">
    <th mat-header-cell *matHeaderCellDef sticky>Timestamp</th>
    <td mat-cell *matCellDef="let element">{{ element[0] | tzDate }}</td>
  </ng-container>

  @for (item of datasets; track $index) {
    <ng-container [matColumnDef]="item.id">
      <th mat-header-cell *matHeaderCellDef sticky>
        <div>{{ item.description.phenomenonLabel }}</div>
        <div>{{ item.description.platformLabel }}</div>
      </th>
      <td mat-cell *matCellDef="let element">
        {{
          element[$index + 1] &&
            element[$index + 1] + " " + item.description.uom
        }}
      </td>
    </ng-container>
  }

  <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
